<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - My Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .navbar {
      display: flex;
      align-items: center;
      background-color: #333;
      padding: 0 20px;
    }

    .logo {
      font-size: 20px;
      color: #f2f2f2;
      font-weight: bold;
      margin-right: auto;
      padding: 14px 0;
    }

    .navbar a {
      color: #f2f2f2;
      text-decoration: none;
      padding: 14px 16px;
      display: block;
    }

    .navbar a:hover {
      background-color: #575757;
    }

    .content {
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">MyWebsite</div>
    <a href="/">Home</a>
    <a href="/about/">About</a>
    <a href="/services/">Services</a>
    <a href="/contact/">Contact</a>
  </div>

  <div class="content">
    <h1>Welcome to My Website</h1>
    <p>This is the home page of a simple multi-page site using GitHub Pages with clean URLs.</p>
  </div>

</body>
</html>
